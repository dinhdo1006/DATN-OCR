# Worker chờ Kafka trả lời rồi mới chạy chương trình chính. Cần cả khi Docker tự bật lại
# container lúc khởi động máy (khi đó depends_on/healthcheck của compose không có tác dụng).
x-wait-kafka: &wait-kafka
  - sh
  - -c
  - |
    until python -c "from kafka import KafkaAdminClient; KafkaAdminClient(bootstrap_servers='kafka:9092').close()" >/dev/null 2>&1; do
      echo "Chờ Kafka sẵn sàng..."; sleep 3
    done
    exec "$$@"
  - --

services:

  # =========================
  # NIFI
  # =========================
  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    restart: always
    depends_on:
      - kafka
      - minio
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_PROXY_HOST: localhost:8443,127.0.0.1:8443
      # Tài khoản lấy từ file .env (không đưa lên git), xem .env.example
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
    networks:
      - ocr-network

  # =========================
  # MINIO
  # =========================
  minio:
    # MinIO đã ngừng phát hành image trên Docker Hub và quay.io (10/2026 trả 401/denied);
    # pgsty/minio là bản build cộng đồng của cùng mã nguồn MinIO, giữ đủ MinIO Console
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      # Docker volume (ext4 trong WSL) thay cho bind mount ổ Windows vì bind mount hay lỗi I/O
      - minio_data:/data
    networks:
      - ocr-network

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Mặc định image ghi log vào /tmp/kafka-logs trong container -> mất thông điệp, offset khi tạo lại container
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Docker volume (ext4 trong WSL) giống MinIO, không dùng bind mount ổ Windows
      - kafka_data:/var/lib/kafka/data
    # Worker chỉ khởi động khi broker trả lời được, tránh lỗi NoBrokersAvailable lúc bật hệ thống
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    networks:
      - ocr-network

  # =========================
  # 1. PREPROCESS (FastAPI)
  # =========================
  preprocess:
    build: ./Preprocess_service
    image: preprocess-local
    container_name: preprocess
    restart: always
    ports:
      - "5000:5000"
    networks:
      - ocr-network

  # =========================
  # 2. LAYOUT DETECTOR (YOLO CPU)
  # =========================
  layout_detector:
    build: ./layout_detector
    image: layout-worker-cpu
    container_name: layout-worker
    entrypoint: *wait-kafka
    command: ["python", "app.py"]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      CPU_NUM_THREADS: 2
    networks:
      - ocr-network

  # =========================
  # 3. PADDLEOCR (Crop)
  # =========================
  paddleocr:
    build: ./paddleocr_crop
    image: paddleocr-crop-local
    container_name: paddleocr-worker
    entrypoint: *wait-kafka
    command: ["python", "-u", "crop_paddleocr.py"]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      # Lưu model PaddleOCR đã tải để không phải tải lại mỗi lần tạo container
      - ./data/paddleocr_models:/root/.paddleocr
    networks:
      - ocr-network

  # =========================
  # 4. VIETOCR (Recognize CPU)
  # =========================
  vietocr:
    build: ./vietocr_api
    image: vietocr-worker-cpu
    container_name: vietocr-worker
    entrypoint: *wait-kafka
    command: ["python", "-u", "app.py"]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - ocr-network

  # =========================
  # 5. OCR RECONSTRUCTION
  # =========================
  reconstruct:
    build: ./ocr_reconstruction
    image: reconstruct-worker-local
    container_name: reconstruct-worker
    entrypoint: *wait-kafka
    command: ["python", "-u", "app.py"]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - ocr-network

  # =========================
  # 6. MERGE
  # =========================
  merge:
    build: ./merge
    image: merge-worker-local
    container_name: merge-worker
    entrypoint: *wait-kafka
    command: ["python", "-u", "app.py"]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - ocr-network

  # =========================
  # 7. WEB UI (upload PDF + xem kết quả)
  # =========================
  web_ui:
    build: ./web_ui
    image: ocr-web-ui-local
    container_name: ocr-web-ui
    restart: always
    depends_on:
      - minio
    ports:
      - "8501:8080"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - ocr-network

# =========================
# VOLUMES
# =========================
volumes:
  minio_data:
    name: ocr_minio_data
    external: true
  kafka_data:
    name: ocr_kafka_data

# =========================
# NETWORKS DEFINITION
# =========================
networks:
  ocr-network:
    driver: bridge