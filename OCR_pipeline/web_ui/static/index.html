<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Tiếng Việt - Test</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e6e8ec; --muted:#9aa1ad; --line:#2d3139; --accent:#5b8def; --ok:#4ade80; --warn:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #drop b { color:var(--text); }
  .grid { display:grid; grid-template-columns: 1fr 1.4fr; gap:16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  tr.doc { cursor:pointer; }
  tr.doc:hover, tr.sel { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .badge.done { color:var(--ok); border-color:var(--ok); }
  .badge.run  { color:var(--warn); border-color:var(--warn); }
  .badge.error { color:#dc2626; border-color:#dc2626; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .bar.done > i { background:var(--ok); }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font:13px/1.55 ui-monospace, Consolas, monospace; max-height:560px; overflow:auto; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .head h2 { font-size:16px; margin:0; }
  button, a.btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; text-decoration:none; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .empty { color:var(--muted); padding:12px 0; }
  #msg { margin-top:10px; min-height:20px; font-size:14px; }
  .err { color:#dc2626; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border-radius:0; padding:5px 10px; }
  .seg button.on { background:var(--accent); color:#fff; }
  a.btn.alt { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 10px; }
  #doc { max-height:620px; overflow:auto; font-size:14px; }
  #doc .page { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; border-top:1px solid var(--line); padding-top:8px; margin:14px 0 6px; }
  #doc .page:first-child { border-top:0; margin-top:0; padding-top:0; }
  #doc h3 { font-size:15px; margin:12px 0 6px; }
  #doc .ln { white-space:pre-wrap; margin:0; }
  #doc .para { margin:0 0 8px; }
  #doc ul { margin:4px 0 8px; padding-left:22px; }
  #doc table.md { width:auto; max-width:100%; margin:6px 0 10px; font-size:13px; }
  #doc table.md th, #doc table.md td { border:1px solid var(--line); padding:4px 8px; vertical-align:top; }
  #doc table.md th { color:var(--text); font-weight:600; background:color-mix(in srgb, var(--accent) 6%, transparent); }
  #doc figure { margin:6px 0 10px; }
  #doc figure img { max-width:100%; border:1px solid var(--line); border-radius:4px; }
  #doc figcaption, #doc summary { color:var(--muted); font-size:12px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>OCR tiếng Việt</h1>
  <p class="sub">Đẩy PDF vào pipeline (MinIO → NiFi → Kafka → OCR) và xem kết quả khi xử lý xong.</p>

  <div class="card">
    <div id="drop"><b>Kéo thả file PDF vào đây</b> hoặc bấm để chọn (có thể chọn nhiều file)</div>
    <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    <div id="msg"></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="head"><h2>Tài liệu</h2><button class="ghost" id="refresh">Làm mới</button></div>
      <div id="list"></div>
    </div>
    <div class="card">
      <div class="head">
        <h2 id="title">Kết quả</h2>
        <span class="tools">
          <span class="seg"><button id="vDoc" class="on">Trình bày</button><button id="vRaw">Văn bản</button></span>
          <span id="dls" style="display:none">
            <a class="btn" id="dlMd">Tải .md</a>
            <a class="btn alt" id="dlJson">.json</a>
            <a class="btn alt" id="dlTxt">.txt</a>
          </span>
        </span>
      </div>
      <div id="doc" class="empty">Chọn một tài liệu để xem nội dung.</div>
      <pre id="out" style="display:none"></pre>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const LABEL = { queued: "Đang chờ NiFi", layout: "Đang phân tích bố cục", ocr: "Đang nhận dạng", partial: "Hoàn tất một phần", done: "Hoàn tất", error: "Lỗi" };
const BADGE = { done: 'done', error: 'error' };
// Mở thẳng một tài liệu qua địa chỉ #doc=<mã> (tiện khi demo)
let selected = decodeURIComponent((location.hash.match(/doc=([^&]+)/) || [])[1] || '') || null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = (t, err) => { $('#msg').innerHTML = `<span class="${err ? 'err' : ''}">${esc(t)}</span>`; };

async function upload(files) {
  for (const f of files) {
    say(`Đang tải lên ${f.name}...`);
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      say(`Đã gửi ${f.name} → mã tài liệu: ${j.id}`);
      selected = j.id;
    } catch (e) { say(`Lỗi ${f.name}: ${e.message}`, true); }
  }
  loadList();
}

async function loadList() {
  try {
    const docs = await (await fetch('/api/documents')).json();
    if (!docs.length) { $('#list').innerHTML = '<div class="empty">Chưa có tài liệu nào.</div>'; return; }
    $('#list').innerHTML = '<table><thead><tr><th>Tên</th><th>Trạng thái</th><th>Tiến độ</th></tr></thead><tbody>' +
      docs.map(d => {
        const pct = d.status === 'done' ? 100 : (d.pages_total ? Math.round(100 * d.pages_done / d.pages_total) : 0);
        const prog = d.pages_total ? `${d.pages_done}/${d.pages_total} trang` : '—';
        return `<tr class="doc ${d.id === selected ? 'sel' : ''}" data-id="${esc(d.id)}">
          <td>${esc(d.id)}</td>
          <td><span class="badge ${BADGE[d.status] || 'run'}">${LABEL[d.status]}</span></td>
          <td><div class="bar ${d.status === 'done' ? 'done' : ''}"><i style="width:${pct}%"></i></div><small>${prog}</small></td></tr>`;
      }).join('') + '</tbody></table>';
    document.querySelectorAll('tr.doc').forEach(tr => tr.onclick = () => { selected = tr.dataset.id; history.replaceState(null, '', '#doc=' + encodeURIComponent(selected)); loadList(); loadDoc(); });
  } catch (e) { say('Không tải được danh sách: ' + e.message, true); }
}

// Dựng lại kết quả có cấu trúc từ Markdown do merge-worker xuất: tiêu đề, bảng, danh sách,
// thẻ [TABLE: …]/[FIGURE: …] trỏ tới ảnh gốc trong assets/. Viết tay để không phụ thuộc thư viện ngoài.
const asset = k => '/api/assets?key=' + encodeURIComponent(k);
function cells(line) { return line.trim().replace(/^\||\|$/g, '').split('|').map(c => esc(c.trim())); }
function renderMd(md) {
  const lines = md.replace(/\r/g, '').split('\n');
  const html = []; let para = [];
  const flush = () => { if (para.length) { html.push('<div class="para">' + para.map(l => `<p class="ln">${esc(l)}</p>`).join('') + '</div>'); para = []; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i], t = l.trim();
    let m;
    if ((m = t.match(/^<!--\s*(page_\d+)\s*-->$/) || t.match(/^=====\s*PAGE\s+(page_\d+)\s*=====$/))) {
      flush(); html.push(`<div class="page">Trang ${esc(m[1].replace('page_', ''))}</div>`);
    } else if (t === '---') { flush();
    } else if (!t) { flush();
    } else if ((m = t.match(/^#{1,6}\s+(.*)$/))) { flush(); html.push(`<h3>${esc(m[1])}</h3>`);
    } else if ((m = t.match(/^\[(TABLE|FIGURE):\s*([^\]]+)\]$/))) {
      flush();
      const img = `<img loading="lazy" src="${asset(m[2].trim())}" alt="${m[1] === 'TABLE' ? 'Ảnh bảng gốc' : 'Hình'}">`;
      html.push(m[1] === 'TABLE'
        ? `<details><summary>Xem ảnh bảng gốc</summary><figure>${img}</figure></details>`
        : `<figure>${img}<figcaption>Hình được tách thành ảnh riêng</figcaption></figure>`);
    } else if (t.startsWith('|')) {
      flush();
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) rows.push(lines[i++].trim());
      i--;
      const sep = rows.length > 1 && /^\|?\s*:?-{3,}/.test(rows[1]);
      const head = sep ? `<thead><tr>${cells(rows[0]).map(c => `<th>${c}</th>`).join('')}</tr></thead>` : '';
      const body = (sep ? rows.slice(2) : rows).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
      html.push(`<table class="md">${head}<tbody>${body}</tbody></table>`);
    } else if ((m = t.match(/^[-•]\s+(.*)$/))) {
      flush();
      const items = [];
      while (i < lines.length && (m = lines[i].trim().match(/^[-•]\s+(.*)$/))) { items.push(`<li>${esc(m[1])}</li>`); i++; }
      i--;
      html.push(`<ul>${items.join('')}</ul>`);
    } else { para.push(l); }
  }
  flush();
  return html.join('');
}

let view = 'doc', current = null;
function show() {
  const d = current; if (!d) return;
  const docEl = $('#doc'), out = $('#out');
  if (d.error) {
    docEl.style.display = ''; out.style.display = 'none';
    docEl.className = 'err';
    docEl.textContent = `Không xử lý được tài liệu. Lý do: ${d.error.message || 'không rõ'}` + (d.error.status_code ? ` (HTTP ${d.error.status_code})` : '');
    return;
  }
  const text = d.text || '(Chưa có trang nào được nhận dạng xong)';
  docEl.className = '';
  if (view === 'doc') {
    const keep = docEl.scrollTop;
    docEl.innerHTML = renderMd(d.markdown || text); docEl.scrollTop = keep;
    docEl.style.display = ''; out.style.display = 'none';
  } else {
    out.textContent = text; out.style.display = ''; docEl.style.display = 'none';
  }
  $('#vDoc').classList.toggle('on', view === 'doc'); $('#vRaw').classList.toggle('on', view === 'raw');
}

async function loadDoc() {
  if (!selected) return;
  const r = await fetch('/api/documents/' + encodeURIComponent(selected));
  if (!r.ok) return;
  const d = await r.json();
  const changed = !current || current.id !== d.id || current.text !== d.text || current.markdown !== d.markdown || current.status !== d.status;
  current = d;
  $('#title').textContent = 'Kết quả: ' + d.id + (d.final ? '' : ' (tạm thời)');
  const base = '/api/documents/' + encodeURIComponent(d.id) + '/download?fmt=';
  $('#dls').style.display = d.final ? '' : 'none';
  $('#dlMd').href = base + 'md'; $('#dlJson').href = base + 'json'; $('#dlTxt').href = base + 'txt';
  if (changed) show();
}
$('#vDoc').onclick = () => { view = 'doc'; show(); };
$('#vRaw').onclick = () => { view = 'raw'; show(); };

const drop = $('#drop'), input = $('#file');
drop.onclick = () => input.click();
input.onchange = () => { upload([...input.files]); input.value = ''; };
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));
$('#refresh').onclick = () => { loadList(); loadDoc(); };

loadList();
loadDoc();
setInterval(() => { loadList(); loadDoc(); }, 4000);
</script>
</body>
</html>
