<!doctype html><html><head><meta charset="utf-8"><script src="dg.js"></script></head><body>
<script>
// Biểu đồ triển khai UML: node dạng khối hộp có stereotype, artifact, đường truyền thông ghi giao thức (không mũi tên)
const g = new Dg(880, 640);
const D = 10;
function node(x, y, w, h, st, name, sub, c, o = {}) {
  const [fill, stroke] = PAL[c];
  g.raw(`<path d="M${x},${y} l${D},-${D} h${w} l-${D},${D} z" fill="${o.top || '#fff'}" stroke="${stroke}" stroke-width="1.6"/>`);
  g.raw(`<path d="M${x + w},${y} l${D},-${D} v${h} l-${D},${D} z" fill="${o.side || fill}" stroke="${stroke}" stroke-width="1.6"/>`);
  g.raw(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill || fill}" stroke="${stroke}" stroke-width="1.6"/>`);
  const tx = o.left ? x + 12 : o.right ? x + w - 14 : x + w / 2, a = o.left ? 'start' : o.right ? 'end' : 'middle', ty = o.ty || y + 18;
  g.text(tx, ty, st, { fs: 13, a, italic: true, color: '#444' });
  g.text(tx, ty + 18, name, { fs: 15, a, bold: true });
  if (sub) g.text(tx, ty + 36, sub, { fs: 14, a });
  return { x, y, w, h, cx: x + w / 2, r: x + w, b: y + h, cy: y + h / 2 };
}
function artifact(x, y, w, name) {
  g.raw(`<path d="M${x},${y} h${w - 10} l10,10 v32 h-${w} z M${x + w - 10},${y} v10 h10" fill="#fff" stroke="#666" stroke-width="1.3"/>`);
  g.text(x + w / 2, y + 16, '«artifact»', { fs: 12, a: 'middle', italic: true, color: '#444' });
  g.text(x + w / 2, y + 33, name, { fs: 13, a: 'middle' });
}
const path = (pts, label, at, la = 'middle') => g.line(pts, { end: 'none', label, at, lfs: 13, la });
// Thiết bị bên ngoài
const user = node(14, 24, 230, 58, '«device»', 'Máy người dùng', 'trình duyệt web', 'gray', { ty: 42 });
const adm = node(626, 24, 230, 58, '«device»', 'Máy quản trị', 'trình duyệt web', 'gray', { ty: 42 });
// Máy chủ và môi trường Docker
node(14, 128, 846, 504, '«device»', 'Máy chủ (Windows + Docker Desktop / Linux)', '', 'blue', { fill: '#f6f9fd', right: true, ty: 146 });
node(30, 178, 806, 440, '«executionEnvironment»', 'Docker Engine – mạng ocr-network', '', 'blue', { fill: '#ffffff', top: '#eef4fb', side: '#dbe8f6', right: true, ty: 196 });
const ui = node(48, 236, 200, 62, '«container»', 'ocr-web-ui', 'FastAPI :8501', 'purple');
const nf = node(334, 236, 200, 62, '«container»', 'nifi 1.25.0', 'HTTPS :8443', 'blue');
const pp = node(646, 236, 166, 62, '«container»', 'preprocess', 'FastAPI :5000', 'blue');
const mi = node(48, 344, 764, 56, '«container»', 'minio – bucket data-lake', ':9000 S3, :9001 Console', 'yellow', { left: true, ty: 360 });
artifact(640, 351, 160, 'ocr_minio_data');
const W = ['layout', 'paddleocr', 'vietocr', 'reconstruct', 'merge'], S = ['DocLayout-YOLO', 'DBNet', 'VGG-Transformer', 'gom dòng', 'ghép trang'];
const ww = 140, gap = (764 - 5 * ww) / 4;
const wk = W.map((n, i) => node(48 + i * (ww + gap), 444, ww, 62, '«container»', n + '-worker', S[i], 'green'));
const kf = node(48, 546, 764, 56, '«container»', 'kafka 3.7.0 (KRaft)', ':9092, 6 topic', 'orange', { left: true, ty: 562 });
artifact(640, 551, 160, 'ocr_kafka_data');
// Đường truyền thông
path([[ui.cx, user.b], [ui.cx, ui.y]], 'HTTP :8501', [ui.cx + 8, 112], 'start');
path([[adm.x + 24, adm.b], [adm.x + 24, 108], [nf.r - 40, 108], [nf.r - 40, nf.y]], 'HTTPS :8443', [nf.r - 48, 154], 'end');
path([[nf.r, nf.cy], [pp.x, pp.cy]], 'HTTP', [595, nf.cy - 8]);
g.text(595, nf.cy + 22, 'POST /process', { fs: 13, a: 'middle' });
path([[ui.cx, ui.b], [ui.cx, mi.y]], 'S3 / HTTP', [ui.cx + 8, 326], 'start');
path([[nf.cx - 30, nf.b], [nf.cx - 30, mi.y]], 'S3 / HTTP', [nf.cx - 38, 326], 'end');
path([[nf.cx + 30, nf.b], [nf.cx + 30, 316], [826, 316], [826, kf.cy], [kf.r, kf.cy]], 'Kafka / TCP', [700, 331]);
wk.forEach((b, i) => {
  path([[b.cx, b.y], [b.cx, mi.b]], i === 0 ? 'S3' : '', [b.cx + 6, 426], 'start');
  path([[b.cx, b.b], [b.cx, kf.y]], i === 0 ? 'Kafka' : '', [b.cx + 6, 528], 'start');
});
g.render();
</script></body></html>
