<!doctype html><html><head><meta charset="utf-8"><script src="dg.js"></script></head><body>
<script>
const g = new Dg(880, 360);
// Tầng trên chỉ dùng tầng dưới; Kafka và MinIO là hạ tầng dùng chung nên cùng nằm ở đáy
const L = [
  { n: ['Giao diện'], c: 'purple', items: [['Trang web', '(HTML, JavaScript)'], ['web_ui API', '(FastAPI, :8501)']] },
  { n: ['Điều phối'], c: 'blue', items: [['Apache NiFi', '(11 processor)'], ['Preprocess', '(FastAPI, :5000)']] },
  { n: ['AI worker'], c: 'green', items: [['layout'], ['paddleocr'], ['vietocr'], ['reconstruct'], ['merge']] },
  { n: ['Hạ tầng', 'dùng chung'], c: 'gray', items: [['Thông điệp', 'Apache Kafka – 6 topic'], ['Lưu trữ', 'MinIO data-lake, Docker volume']], sub: ['orange', 'yellow'] }
];
const x0 = 6, w = 800, h = 66, gap = 14, lw = 140;
L.forEach((l, i) => {
  const y = 8 + i * (h + gap);
  g.box(x0, y, w, h, [], { c: l.c, rx: 8 });
  g.text(x0 + 14, y + h / 2 + 6 - (l.n.length - 1) * 10, l.n, { fs: 16, bold: true, lh: 20 });
  const n = l.items.length, iw = (w - lw - 14 - (n - 1) * 8) / n;
  l.items.forEach((it, k) => {
    const c = l.sub ? l.sub[k] : null;
    g.box(x0 + lw + k * (iw + 8), y + 9, iw, h - 18, it, c ? { c, fs: 16, lh: 19 } : { c: 'white', fs: 16, title: false, stroke: PAL[l.c][1] });
  });
  if (i < L.length - 1) g.line([[x0 + w + 36, y + 20], [x0 + w + 36, y + h + gap + 20]]);
});
g.raw(`<text x="866" y="166" font-size="15" fill="#333" text-anchor="middle" transform="rotate(90 866 166)">phụ thuộc một chiều</text>`);
g.text(406, 346, 'web_ui chỉ đọc, ghi MinIO; các worker không gọi nhau mà chỉ nối qua Kafka và MinIO.', { fs: 14, a: 'middle', italic: true, color: '#444' });
g.render();
</script></body></html>
